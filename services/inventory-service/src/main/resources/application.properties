spring.application.name=inventory-service
server.port=8082

# --- Database (inventory_db is owned by this service only) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=${POSTGRES_USER:platform}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092

# Consumer: one group for all instances of this service.
spring.kafka.consumer.group-id=inventory-service
# A brand-new group starts from the oldest message instead of only new ones.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Commit the offset after each record is processed successfully (Spring's default is per poll batch).
spring.kafka.listener.ack-mode=record
# 3 listener threads = one per partition of order.created.
spring.kafka.listener.concurrency=3

# Producer (same settings as order-service).
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false

# --- Errors as RFC 9457 problem+json ---
spring.mvc.problemdetails.enabled=true
