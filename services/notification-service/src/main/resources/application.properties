spring.application.name=notification-service
server.port=8083

# --- Database (notifications_db is owned by this service only) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/notifications_db
spring.datasource.username=${POSTGRES_USER:platform}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Kafka consumer ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3
