spring.application.name=order-service
server.port=8081

# --- Database (orders_db is owned by this service only) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/orders_db
spring.datasource.username=${POSTGRES_USER:platform}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}
# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading outside service transactions (makes hidden queries visible).
spring.jpa.open-in-view=false
# Show every SQL statement.
logging.level.org.hibernate.SQL=debug

# --- Kafka producer ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# The contract is the JSON envelope, not our Java class name.
spring.kafka.producer.properties.spring.json.add.type.headers=false
